[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dotenvelope"
version = "0.1.0"
description = "Check .env.example against what your code actually reads: undocumented, zombie, and no-default env vars."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["env", "environment", "dotenv", "audit", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
dotenvelope = "dotenvelope.cli:main"

[tool.setuptools.packages.find]
include = ["dotenvelope*"]